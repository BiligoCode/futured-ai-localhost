[project]
name = "educator-api"
version = "0.1.0"
description = "AI visual explanations for educators: Manim + narration pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic>=2",
    "python-dotenv",
    "boto3>=1.39",
    "httpx",
    "pypdf",
    "manim",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "reportlab",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["slow: uses real manim/ffmpeg"]
testpaths = ["tests"]
pythonpath = ["."]
